# 광고주 목록. 광고주를 추가하려면 항목을 하나 더 넣고, 그 광고주의 Secret을 prefix를 붙여 등록한다.
#
# id            실행 이름과 로그에 쓰는 짧은 이름 (영문 소문자)
# secret_prefix 이 광고주 Secret 이름 앞에 붙는 말. 예: "ACME_"면 ACME_SHEET_ID, ACME_NAVER_API_KEY ...
#               광고주별 Secret이 없으면 prefix 없는 공용 Secret(GOOGLE_ADS_REFRESH_TOKEN 등)을 쓴다.
#               계정·ID는 공개 저장소에 올리지 않도록 이 파일이 아니라 Secret에 둔다.
# sources       가져올 매체: google, naver
# destination   적재 방식. 지금은 sheets_wsa(WSA 시트 11개 탭 구조)만 있다.
# enabled       false면 예약 실행에서 빠진다. 수동 실행에서는 이름으로 골라 돌릴 수 있다.
advertisers:
  - id: wsa
    name: WSA와인아카데미
    secret_prefix: ""
    sources: [google, naver]
    destination: sheets_wsa
    enabled: true
